name: release

# Pushing a tag vX.Y.Z publishes that release. The Marketplace lists it, because
# the action was listed once by hand (the Marketplace has no API for that step).
#
# To release 1.2.3: rename CHANGELOG.md's [Unreleased] to "[1.2.3] - <date>",
# merge to main, then push tag v1.2.3. The release fails if the tag isn't on
# main or CHANGELOG.md has no section for it. It moves the major tag (v1) to
# the release, which is what `uses: momiji-rs/termshot-action@v1` follows.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and move the major tag
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi
      - name: notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v head="## [$version]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          cat notes.md
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "termshot screens ${GITHUB_REF_NAME#v}" --notes-file notes.md
      - name: move the major tag
        run: |
          major=${GITHUB_REF_NAME%%.*}
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
          echo "$major -> $(git rev-parse --short "$GITHUB_SHA")"
