name: screens-publish

# Publishes what screens.yml rendered: baselines for pushes, comments for pull
# requests, forks included. It runs from the default branch and never runs the
# code that was screenshot.
on:
  workflow_run:
    workflows: [screens]
    types: [completed]

permissions:
  contents: write        # store the images on the termshot-assets branch
  pull-requests: write   # post the comment

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # The default branch: this repository's own action, not the fork's.
      - uses: actions/checkout@v7
      - uses: ./
        with:
          size: 34x11
          px: '32'
      - uses: ./
        with:
          id: bubbletea
          args: --lf-newline
      - uses: ./
        with:
          id: ratatui
