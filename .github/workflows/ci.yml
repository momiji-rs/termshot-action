name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: install
        run: ./install.sh
        env:
          VERSION: 0.2.0
      - run: python3 tests/run.py "${{ steps.install.outputs.bin }}"
      - name: action.yml and workflows parse as YAML
        run: ruby -ryaml -e 'Dir["{action.yml,.github/workflows/*.yml}"].each { |f| YAML.load_file(f) }'
