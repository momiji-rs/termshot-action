name: ci

on:
  push:
    branches: ['**']   # tags run these tests from release.yml instead
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # The core's own tests live with it, in momiji-rs/gh-termshot. This runs the
  # action as a workflow would, on each runner it supports: download the core,
  # check it, capture a TUI driven by keys, render, and leave the artifact.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./
        id: shots
        with:
          mode: render
          id: smoke-${{ matrix.os }}
          size: 34x11
          shots: |
            menu: ./demo/menu.sh
              wait-for Inbox
              snap start
              key down down
              key enter
              wait-for Opened
      - name: the screens and the bundle are there
        env:
          DIR: ${{ steps.shots.outputs.dir }}
        run: |
          ls -la "$DIR"
          for f in menu.png menu.start.png menu.json menu.pty .termshot-bundle.json; do test -s "$DIR/$f"; done
          grep -q 'Opened Sent' "$DIR/menu.txt"
          grep -q 'Inbox' "$DIR/menu.start.txt"
          printf '\211PNG\r\n\032\n' | cmp - <(head -c 8 "$DIR/menu.png")

  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: action.yml and workflows parse as YAML
        run: ruby -ryaml -e 'Dir["{action.yml,.github/workflows/*.yml}"].each { |f| YAML.load_file(f) }'
