name: screens

# The action on itself: screens of demo/menu.sh. This job runs the repository's
# code, so it holds no permissions at all; screens-publish.yml publishes.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          mode: render
          size: 34x11
          px: '32'
          shots: |
            menu: ./demo/menu.sh
              wait-for Inbox
              snap start
              key down down
              key enter
              wait-for Opened

      # The Bubble Tea guide's example (docs/bubbletea.md): its teatest golden
      # files are its screens. go test fails if a golden is out of date, so
      # what is screenshot is what the tests check.
      - uses: actions/setup-go@v7
        with:
          go-version-file: examples/bubbletea/go.mod
          cache-dependency-path: examples/bubbletea/go.sum
      - run: go test ./...
        working-directory: examples/bubbletea
      - uses: ./
        with:
          mode: render
          id: bubbletea
          logs: examples/bubbletea/testdata/*.golden@48x12
          args: --lf-newline

      # The Ratatui guide's example (docs/ratatui.md): insta keeps an ANSI
      # snapshot of each screen beside its text snapshot. cargo test fails if one
      # is out of date (under CI, insta doesn't accept new snapshots).
      - run: cargo test --locked
        working-directory: examples/ratatui
      - uses: ./
        with:
          mode: render
          id: ratatui
          logs: examples/ratatui/src/snapshots/*.snap.ansi@40x10

      # The Ink guide's example (docs/ink.md): each test writes the frame it
      # checks with toMatchFileSnapshot, in colour. Vitest fails if one is out of
      # date (under CI it doesn't write new snapshots).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/ink/package-lock.json
      - run: npm ci && npm test
        working-directory: examples/ink
      - uses: ./
        with:
          mode: render
          id: ink
          logs: examples/ink/src/__screens__/*.ansi@40x8
          args: --lf-newline
