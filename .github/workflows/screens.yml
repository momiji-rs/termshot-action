name: screens

# The action on itself: screens of demo/menu.sh. This job runs the repository's
# code, so it holds no permissions at all; screens-publish.yml publishes.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          mode: render
          size: 34x11
          px: '32'
          shots: |
            menu: ./demo/menu.sh
              wait-for Inbox
              snap start
              key down down
              key enter
              wait-for Opened
