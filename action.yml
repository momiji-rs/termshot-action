name: termshot screens
description: Screenshot terminal commands and TUIs in CI and show what changed on the pull request
author: momiji-rs
branding:
  icon: terminal
  color: orange

inputs:
  mode:
    description: run (capture and publish), render (capture only, for a read-only job), publish (from a workflow_run, or `bundle-dir`), or auto
    default: auto
  images:
    description: "In mode publish: rerender (render the logs with this action's termshot) or bundle (use the images the render job made, from this repository's branches only)"
    default: rerender
  bundle-dir:
    description: "A downloaded termshot artifact to publish, in a job after a `mode: render` job of the same run"
  shots:
    description: |
      One shot per line, as `name: command` or `name@COLSxROWS: command`. Each command
      runs under bash in a real PTY; one still running after `timeout` seconds is
      captured as it is. Indented lines below a shot drive it: `wait 0.5`,
      `wait-for TEXT`, `type TEXT`, `key down enter ctrl-c`, `snap NAME`.
  logs:
    description: Globs of PTY logs you already recorded, each optionally `@COLSxROWS`
  size:
    description: Terminal size, COLSxROWS
    default: 100x30
  px:
    description: Font pixel height
    default: '28'
  timeout:
    description: Seconds a command may run before its screen is taken
    default: '10'
  font:
    description: TrueType or OpenType font (default the built-in JetBrains Mono)
  fallback-font:
    description: Font for characters the first lacks, such as CJK
  args:
    description: Extra termshot arguments, such as --lf-newline
  id:
    description: Names this set of screens, to tell apart several uses in one repository
    default: termshot
  comment:
    description: auto (comment on pull requests when the token can) or never
    default: auto
  publish:
    description: Push the PNGs to `assets-branch` so the comment can show them
    default: 'true'
  assets-branch:
    description: Orphan branch holding the images and the baselines
    default: termshot-assets
  assets-repo:
    description: Repository holding the assets branch (default this one)
  assets-token:
    description: Token for `assets-repo` (default `github-token`)
  retention-days:
    description: Prune screens of pull requests closed this many days ago (0 keeps them)
    default: '30'
  fail-on-change:
    description: Fail when a screen differs from the base branch's baseline
    default: 'false'
  github-token:
    description: Token with contents and pull-requests write
    default: ${{ github.token }}
  core-version:
    description: gh-termshot release that does the work (the action's core)
    default: 0.2.0
  core-path:
    description: Use this gh-termshot binary instead of downloading one
  termshot-version:
    description: Render with this termshot release's CLI instead of the termshot library built into the core
  termshot-path:
    description: Render with this termshot binary (for a project whose change is the renderer)

outputs:
  changed:
    description: Number of screens that differ from the baseline
    value: ${{ steps.run.outputs.changed }}
  dir:
    description: Directory with the logs, PNGs and texts
    value: ${{ steps.run.outputs.dir }}
  comment-url:
    description: The pull request comment, when one was posted
    value: ${{ steps.run.outputs.comment-url }}

runs:
  using: composite
  steps:
    - name: install the core
      id: core
      shell: bash
      env:
        VERSION: ${{ inputs.core-version }}
        LOCAL: ${{ inputs.core-path }}
      run: '"$GITHUB_ACTION_PATH/install-core.sh"'

    - name: install termshot
      id: install
      if: inputs.termshot-path != '' || inputs.termshot-version != ''
      shell: bash
      env:
        VERSION: ${{ inputs.termshot-version }}
        LOCAL: ${{ inputs.termshot-path }}
      run: '"$GITHUB_ACTION_PATH/install.sh"'

    - name: capture, render and report
      id: run
      shell: bash
      env:
        INPUT_TERMSHOT: ${{ steps.install.outputs.bin }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_BUNDLE_DIR: ${{ inputs.bundle-dir }}
        INPUT_IMAGES: ${{ inputs.images }}
        INPUT_SHOTS: ${{ inputs.shots }}
        INPUT_LOGS: ${{ inputs.logs }}
        INPUT_SIZE: ${{ inputs.size }}
        INPUT_PX: ${{ inputs.px }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_FONT: ${{ inputs.font }}
        INPUT_FALLBACK_FONT: ${{ inputs.fallback-font }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_ID: ${{ inputs.id }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_PUBLISH: ${{ inputs.publish }}
        INPUT_ASSETS_BRANCH: ${{ inputs.assets-branch }}
        INPUT_ASSETS_REPO: ${{ inputs.assets-repo }}
        INPUT_ASSETS_TOKEN: ${{ inputs.assets-token }}
        INPUT_RETENTION_DAYS: ${{ inputs.retention-days }}
        INPUT_FAIL_ON_CHANGE: ${{ inputs.fail-on-change }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_OUTPUT_DIR: ${{ runner.temp }}/termshot-${{ inputs.id }}
        CORE: ${{ steps.core.outputs.bin }}
      run: '"$CORE" action'

    - name: upload screens
      if: always() && steps.run.outputs.dir != '' && github.event_name != 'workflow_run' && inputs.bundle-dir == ''
      uses: actions/upload-artifact@v7
      with:
        name: termshot-${{ inputs.id }}
        path: ${{ steps.run.outputs.dir }}
        if-no-files-found: ignore
        include-hidden-files: true
